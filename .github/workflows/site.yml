name: Site

# Puts site/ on GitHub Pages. It waits until the maintainer turns Pages on (Settings, Pages,
# Source: GitHub Actions) and sets the repository variable SITE to "on". Until then the job is
# skipped, so a push never fails for want of Pages.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE == 'on'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
