name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Look for private data
        run: scripts/check-public
      - name: Build
        run: swift build
      - name: Test
        run: scripts/test
